# Tema oscuro con la paleta del proyecto (la misma de los gráficos y del reporte HTML).
[theme]
base = "dark"
primaryColor = "#2DE2CF"
backgroundColor = "#0E1621"
secondaryBackgroundColor = "#172433"
textColor = "#F2F5F8"
borderColor = "#2C4560"
linkColor = "#2DE2CF"
font = "sans-serif"
baseRadius = "medium"
chartCategoricalColors = ["#2DE2CF", "#E879F9", "#FFB627", "#5AA9FF", "#3DDC84", "#C3A6FF", "#FF5D73"]

[theme.sidebar]
backgroundColor = "#131F2D"
secondaryBackgroundColor = "#1F3044"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
